<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#00e5ff" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg-grad)" opacity="0.15" stroke="url(#bg-grad)" stroke-width="8" />
  <g filter="url(#glow)">
    <!-- Calculator body icon -->
    <rect x="116" y="80" width="280" height="352" rx="40" fill="#111827" stroke="url(#bg-grad)" stroke-width="12"/>
    <!-- Screen display -->
    <rect x="148" y="120" width="216" height="80" rx="16" fill="#030712" stroke="#1f2937" stroke-width="4"/>
    <!-- Math symbols -->
    <line x1="160" y1="240" x2="200" y2="240" stroke="#00e5ff" stroke-width="12" stroke-linecap="round"/>
    <line x1="180" y1="220" x2="180" y2="260" stroke="#00e5ff" stroke-width="12" stroke-linecap="round"/>
    
    <line x1="312" y1="240" x2="352" y2="240" stroke="#ff007f" stroke-width="12" stroke-linecap="round"/>

    <line x1="166" y1="310" x2="194" y2="338" stroke="#39ff14" stroke-width="12" stroke-linecap="round"/>
    <line x1="194" y1="310" x2="166" y2="338" stroke="#39ff14" stroke-width="12" stroke-linecap="round"/>

    <line x1="312" y1="318" x2="352" y2="318" stroke="#ffb700" stroke-width="12" stroke-linecap="round"/>
    <line x1="312" y1="334" x2="352" y2="334" stroke="#ffb700" stroke-width="12" stroke-linecap="round"/>

    <!-- Keypad dots -->
    <circle cx="256" cy="240" r="14" fill="#6366f1"/>
    <circle cx="256" cy="326" r="14" fill="#6366f1"/>
    <circle cx="180" cy="386" r="14" fill="#6366f1"/>
    <circle cx="256" cy="386" r="14" fill="#6366f1"/>
    <circle cx="332" cy="386" r="14" fill="#00e5ff"/>
  </g>
</svg>
